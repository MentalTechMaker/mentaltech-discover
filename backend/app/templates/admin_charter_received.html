<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #e2574a; }
        .content { color: #2c3e50; line-height: 1.6; }
        .field { margin: 8px 0; }
        .field strong { display: inline-block; min-width: 110px; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0; color: #7f8c8d; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Collectif MentalTech</div>
        </div>
        <div class="content">
            <h2 style="color: #2c3e50;">Nouvelle signature confirmée</h2>
            <div class="field"><strong>Nom</strong> {{ name }}</div>
            <div class="field"><strong>Organisation</strong> {{ organization }}</div>
            <div class="field"><strong>Email</strong> {{ email }}</div>
            <div class="field"><strong>Type</strong> {{ kind }}</div>
        </div>
        <div class="footer">
            <p>Collectif MentalTech — notification automatique</p>
        </div>
    </div>
</body>
</html>
